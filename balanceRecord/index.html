    [/电影|猫眼|游戏|会员|视频|音乐|网易云|爱奇艺|哔哩|b站|演出|livehouse/, '娱乐'],
    [/医院|药房|药店|诊所|体检|挂号|医疗/, '医疗'],
    [/话费|流量|中国移动|中国联通|中国电信/, '通讯']
  ];
  for (const [re, name] of rules) if (re.test(s)) return catIdByName(name, 'expense');
  return fallbackCat('expense');
}

function catIdByName(name, type) {
  const c = db.categories.find(x => x.name === name && x.type === type);
  return c ? c.id : fallbackCat(type);
}

function fallbackCat(type) {
  const c = db.categories.find(x => x.type === type && x.name === '其他');
  return c ? c.id : defaultCat(type);
}

function guessAccount(text) {
  if (!db.accounts.length) return '';
  const norm = s => String(s || '').replace(/[\s()（）·\-—_]/g, '');
  const t = norm(text);
  if (t) {
    for (const a of db.accounts) {
      const n = norm(a.name);
      if (n && (t.includes(n) || n.includes(t))) return a.id;
    }
    if (/支付宝|余额宝|花呗/.test(t)) { const a = db.accounts.find(x => x.type === 'alipay'); if (a) return a.id; }
    if (/零钱|微信/.test(t)) { const a = db.accounts.find(x => x.type === 'wechat'); if (a) return a.id; }
    if (/信用卡/.test(t)) { const a = db.accounts.find(x => x.type === 'credit'); if (a) return a.id; }
    if (/现金/.test(t)) { const a = db.accounts.find(x => x.type === 'cash'); if (a) return a.id; }
  }
  return db.accounts[0].id;
}

/* ---------- 账单表格 → 待导入记录 ---------- */
function importMatrix(rows) {
  let hIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 80); i++) {
    const j = (rows[i] || []).join('|');
    if (j.includes('交易时间') && (j.includes('收/支') || j.includes('收支'))) { hIdx = i; break; }
  }
  if (hIdx < 0) { toast('没识别出账单格式，请确认是支付宝/微信导出的账单', 'error'); return; }

  const headers = (rows[hIdx] || []).map(h => String(h == null ? '' : h).trim());
  const colOf = names => {
    for (const n of names) {
      const i = headers.findIndex(h => h.replace(/[\s（）()]/g, '').includes(n));
      if (i >= 0) return i;
    }
    return -1;
  };
  const iDate = colOf(['交易时间', '交易创建时间', '时间']);
  const iDir = colOf(['收/支', '收支']);
  const iAmt = colOf(['金额']);
  const iPayee = colOf(['交易对方', '对方']);
  const iGoods = colOf(['商品说明', '商品名称', '商品']);
  const iAcc = colOf(['收/付款方式', '支付方式', '付款方式']);
  const iStatus = colOf(['交易状态', '当前状态', '状态']);
  const iRef = colOf(['交易订单号', '交易单号', '订单号']);
  if (iDate < 0 || iAmt < 0 || iDir < 0) { toast('账单缺少必要列（交易时间/金额/收支）', 'error'); return; }

  const existing = new Set(db.transactions.map(t => t.ref).filter(Boolean));
  const picked = [];
  let dup = 0, skipped = 0;
  for (let r = hIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || !row.length) continue;
    const date = normalizeDateValue(row[iDate]);
    if (!date) continue;
    const dirText = String(row[iDir] == null ? '' : row[iDir]).trim();
    const type = /收入/.test(dirText) ? 'income' : /支出/.test(dirText) ? 'expense' : null;
    if (!type) { skipped++; continue; }
    const status = iStatus >= 0 ? String(row[iStatus] == null ? '' : row[iStatus]) : '';
    if (/关闭|失败|失效/.test(status)) { skipped++; continue; }
    // 全额退款：原支出与退款收入都不计入；部分退款：保留原支出，跳过退款入账
    if (/退款|退还/.test(status) && (type === 'income' || /全额退款/.test(status))) { skipped++; continue; }
    const amount = toCents(row[iAmt]);
    if (amount <= 0) { skipped++; continue; }
    const ref = iRef >= 0 ? String(row[iRef] == null ? '' : row[iRef]).trim() : '';
    if (ref && existing.has(ref)) { dup++; continue; }
    const clean = v => { const t = String(v == null ? '' : v).trim(); return t === '/' || t === '-' || t === '—' ? '' : t; };
    const payee = iPayee >= 0 ? clean(row[iPayee]) : '';
    const goods = iGoods >= 0 ? clean(row[iGoods]) : '';
    const accText = iAcc >= 0 ? String(row[iAcc] == null ? '' : row[iAcc]) : '';
    let desc = payee && goods && goods !== payee ? payee + ' · ' + goods : (payee || goods || '账单导入');
    desc = desc.replace(/\s+/g, ' ').slice(0, 40);
    picked.push({
      date, type, amount, desc, ref: ref || '',
      catId: guessCategory(payee + ' ' + goods, type),
      accId: guessAccount(accText)
    });
  }
  if (!picked.length) {
    toast('没有可导入的新记录' + (dup ? '（' + dup + ' 笔重复）' : ''), 'error');
    return;
  }
  importState = { rows: picked, skipped };
  toast('已识别 ' + picked.length + ' 笔记录，确认后导入' + (dup ? '（跳过 ' + dup + ' 笔重复）' : ''));
  openImportPreview();
}

/* ---------- XLSX 解析（自带 ZIP 解压，无外部依赖） ---------- */
function readFileBuffer(file) {
  if (file && typeof file.arrayBuffer === 'function') return file.arrayBuffer();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('读取文件失败'));
    fr.readAsArrayBuffer(file);
  });
}

async function inflateRaw(u8) {
  if (typeof DecompressionStream === 'undefined' || typeof ReadableStream === 'undefined') {
    throw new Error('当前浏览器不支持解压 xlsx，请换 Chrome / Edge，或改用 CSV 导入');
  }
  let ds;
  try { ds = new DecompressionStream('deflate-raw'); }
  catch (e) { throw new Error('当前浏览器不支持解压 xlsx，请换 Chrome / Edge，或改用 CSV 导入'); }
  const rs = new ReadableStream({ start(c) { c.enqueue(u8); c.close(); } });
  const reader = rs.pipeThrough(ds).getReader();
  const chunks = [];
  let total = 0;
  for (;;) {
    const step = await reader.read();
    if (step.done) break;
    chunks.push(step.value);
    total += step.value.length;
  }
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return new TextDecoder('utf-8').decode(out);
}

async function unzipEntries(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  const floor = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= floor; i--) {
    if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 xlsx 文件');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = new Map();
  const dec = new TextDecoder('utf-8');
  for (let i = 0; i < count && p + 46 <= u8.length; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (!/\.xml$/i.test(name)) continue;
    const lp = localOff;
    if (dv.getUint32(lp, true) !== 0x04034b50) continue;
    const lNameLen = dv.getUint16(lp + 26, true);
    const lExtraLen = dv.getUint16(lp + 28, true);
    const start = lp + 30 + lNameLen + lExtraLen;
    const raw = u8.subarray(start, start + compSize);
    if (method === 0) files.set(name, dec.decode(raw));
    else if (method === 8) files.set(name, await inflateRaw(raw));
  }
  return files;
}

function colLettersToIndex(letters) {
  let n = 0;
  for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}

function parseSharedStrings(xml) {
  if (!xml) return [];
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  return Array.from(doc.getElementsByTagName('si')).map(si => {
    const clean = si.cloneNode(true);
    Array.from(clean.getElementsByTagName('rPh')).forEach(n => n.remove());
    return Array.from(clean.getElementsByTagName('t')).map(t => t.textContent || '').join('');
  });
}

function parseSheetXml(xml, shared) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('xlsx 工作表内容损坏');
  const rows = [];
  const rowEls = doc.getElementsByTagName('row');
  for (let ri = 0; ri < rowEls.length; ri++) {
    const cells = [];
    const cellEls = rowEls[ri].getElementsByTagName('c');
    for (let ci = 0; ci < cellEls.length; ci++) {
      const c = cellEls[ci];
      const m = (c.getAttribute('r') || '').match(/^([A-Z]+)/);
      const idx = m ? colLettersToIndex(m[1]) : cells.length;
      const t = c.getAttribute('t');
      let val = '';
      if (t === 's') {
        const v = c.getElementsByTagName('v')[0];
        val = v ? (shared[parseInt(v.textContent, 10)] || '') : '';
      } else if (t === 'inlineStr') {
        val = Array.from(c.getElementsByTagName('t')).map(x => x.textContent || '').join('');
      } else {
        const v = c.getElementsByTagName('v')[0];
        val = v ? v.textContent : '';
        if (t === 'b') val = val === '1' ? 'TRUE' : 'FALSE';
      }
      cells[idx] = String(val == null ? '' : val).trim();
    }
    const arr = [];
    for (let i = 0; i < cells.length; i++) arr[i] = cells[i] === undefined ? '' : cells[i];
    rows.push(arr);
  }
  return rows;
}

function normalizeDateValue(v) {
  if (v == null) return '';
  const s = String(v).trim();
  if (!s) return '';
  const m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  const n = Number(s);
  if (Number.isFinite(n) && n > 20000 && n < 80000) {
    const d = new Date(Math.round((n - 25569) * 86400000));
    if (!isNaN(d.getTime())) {
      return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
    }
  }
  return '';
}

async function xlsxToRows(buf) {
  const files = await unzipEntries(buf);
  const shared = parseSharedStrings(files.get('xl/sharedStrings.xml') || '');
  const sheet = files.get('xl/worksheets/sheet1.xml') || files.get('xl/worksheets/Sheet1.xml');
  if (!sheet) throw new Error('xlsx 里找不到工作表');
  return parseSheetXml(sheet, shared);
}

async function fileToRows(file) {
  const buf = await readFileBuffer(file);
  const u8 = new Uint8Array(buf);
  if (u8.length > 4 && u8[0] === 0xd0 && u8[1] === 0xcf) {
    throw new Error('这个文件被 Office 加密了，请先用 Excel/WPS 另存为普通 xlsx');
  }
  if (u8.length > 4 && u8[0] === 0x50 && u8[1] === 0x4b) return xlsxToRows(buf);
  return parseCSV(decodeText(buf));
}

async function handleBillFile(file) {
  if (!file) return;
  toast('正在解析账单…');
  try {
    const rows = await fileToRows(file);
    importMatrix(rows);
  } catch (e) {
    console.warn('[import]', e);
    toast('读取账单失败：' + (e && e.message ? e.message : e), 'error');
  }
}

function openImportPreview() {
  const rows = importState.rows;
  const exp = rows.filter(r => r.type === 'expense').reduce((a, b) => a + b.amount, 0);
  const inc = rows.filter(r => r.type === 'income').reduce((a, b) => a + b.amount, 0);
  const catSel = (r, i) => `<select data-imp="cat" data-i="${i}">` +
    db.categories.filter(c => c.type === r.type).map(c =>
      `<option value="${esc(c.id)}"${c.id === r.catId ? ' selected' : ''}>${c.emoji} ${esc(c.name)}</option>`).join('') + '</select>';
  const accSel = (r, i) => `<select data-imp="acc" data-i="${i}">` +
    db.accounts.map(a => `<option value="${esc(a.id)}"${a.id === r.accId ? ' selected' : ''}>${ACC_TYPES[a.type].emoji} ${esc(a.name)}</option>`).join('') + '</select>';

  const previewLimit = 200;
  const list = rows.slice(0, previewLimit).map((r, i) => `<div class="imp-row">
      <div class="imp-date tnum">${esc(r.date.slice(5))}<div class="imp-yr">${esc(r.date.slice(0, 4))}</div></div>
      <div class="imp-desc"><div class="tx-title" style="font-size:13px">${esc(r.desc)}</div>
        <div class="tx-meta">${r.ref ? '单号 ' + esc(r.ref.slice(-8)) : '无单号'}</div></div>
      <div class="imp-amt tnum ${r.type === 'income' ? 'inc' : 'exp'}">${r.type === 'income' ? '+' : '-'}${fmtY(r.amount)}</div>
      <div class="imp-sel">${catSel(r, i)}</div>
      <div class="imp-sel">${accSel(r, i)}</div>
    </div>`).join('') + (rows.length > previewLimit
      ? `<p class="muted" style="font-size:11.5px;text-align:center;padding:6px 0">仅显示前 ${previewLimit} 笔，其余 ${rows.length - previewLimit} 笔会按自动匹配的分类/账户一起导入</p>`
      : '');

  openModal(`<div class="modal-head"><h3>导入账单 · ${rows.length} 笔</h3>
      <button class="icon-btn" data-close aria-label="关闭">✕</button></div>
    <div class="modal-body">
      <p class="muted" style="font-size:12px">已按商户名自动匹配分类和账户，可逐条调整后再导入。${importState.skipped ? '已跳过 ' + importState.skipped + ' 笔不计收支/关闭/退款的记录。' : ''}</p>
      <div class="imp-list">${list}</div>
    </div>
    <div class="modal-foot">
      <div class="grow" style="font-size:12px;color:var(--muted)">支出 ${fmtY(exp)} · 收入 ${fmtY(inc)}</div>
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="imp-do">导入 ${rows.length} 笔</button>
    </div>`, { wide: true });

  $$('#modal-root [data-imp="cat"]').forEach(s => s.onchange = () => { rows[+s.dataset.i].catId = s.value; });
  $$('#modal-root [data-imp="acc"]').forEach(s => s.onchange = () => { rows[+s.dataset.i].accId = s.value; });
  $('#imp-do').onclick = () => {
    const existing = new Set(db.transactions.map(t => t.ref).filter(Boolean));
    let n = 0;
    for (const r of rows) {
      if (r.ref && existing.has(r.ref)) continue;
      db.transactions.push({
        id: uid('tx'), type: r.type, amount: r.amount, date: r.date,
        categoryId: r.catId, accountId: r.accId, toAccountId: '',
        tags: [], note: r.desc, ref: r.ref, createdAt: Date.now()
      });
      if (r.ref) existing.add(r.ref);
      n++;
    }
    save(); closeModal(); importState = null;
    ui.page = 'transactions';
    ui.filters = { q: '', type: 'all', cat: 'all', acc: 'all', tag: 'all', from: '', to: '', min: '', max: '' };
    render();
    toast('已导入 ' + n + ' 笔记录');
  };
}

<script>
'use strict';

/* ================= 主题 ================= */
const SUN_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function isDarkNow() {
  const pref = (db && db.settings.theme) || 'dark';
  if (pref === 'auto') return window.matchMedia('(prefers-color-scheme: dark)').matches;
  return pref !== 'light';
}

function applyTheme() {
  const dark = isDarkNow();
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0a0c11' : '#f4f6fb');
  const btn = document.querySelector('[data-action="theme"]');
  if (btn) btn.innerHTML = dark ? SUN_SVG : MOON_SVG;
}

function toggleTheme() {
  db.settings.theme = isDarkNow() ? 'light' : 'dark';
  save();
  applyTheme();
  if (ui.page === 'settings') render();
}

/* ================= 页面渲染 ================= */
function render() {
  if (!db) return;
  syncNav();
  const meta = PAGE_META[ui.page] || PAGE_META.dashboard;
  const titleEl = $('#page-title'), subEl = $('#page-sub');
  if (titleEl) titleEl.textContent = meta.title;
  if (subEl) subEl.textContent = meta.sub;
  const view = $('#view');
  let html = '';
  if (ui.page === 'dashboard') html = pageDashboard();
  else if (ui.page === 'transactions') html = pageTransactions();
  else if (ui.page === 'accounts') html = pageAccounts();
  else if (ui.page === 'recurring') html = pageRecurring();
  else if (ui.page === 'settings') html = pageSettings();
  view.innerHTML = html;
  if (ui.page === 'transactions') refreshTxList();
}

/* ================= 数据操作 ================= */
async function deleteCategory(id) {
  const c = catById(id);
  if (!c) return;
  const used = db.transactions.filter(t => t.categoryId === id).length;
  if (used > 0) { toast('该分类下有 ' + used + ' 笔记录，先改掉它们再删除', 'error'); return; }
  const ok = await askConfirm({ title: '删除分类？', message: '确定删除「' + esc(c.name) + '」吗？', okText: '删除', danger: true });
  if (!ok) return;
  db.categories = db.categories.filter(x => x.id !== id);
  save(); render(); toast('分类已删除');
}

async function doSeed() {
  const ok = await askConfirm({
    title: '载入示例数据？',
    message: '当前的账本会被 4 个月的模拟数据替换（建议先导出备份）。',
    okText: '载入示例', danger: true
  });
  if (!ok) return;
  const theme = db.settings.theme;
  db = seedDb();
  db.settings.theme = theme;
  save();
  ui.page = 'dashboard';
  ui.month = curMonth();
  render();
  toast('示例数据已载入，随便逛逛吧');
}

async function doClear() {
  const ok = await askConfirm({
    title: '清空全部数据？',
    message: '会删除所有流水、账户、周期账单和标签，只保留一套默认分类。此操作不可撤销。',
    okText: '全部清空', danger: true
  });
  if (!ok) return;
  db = normalize({
    accounts: freshAccounts(), categories: freshCategories(), tags: [],
    transactions: [], recurring: [], settings: { theme: db.settings.theme }
  });
  save();
  ui.page = 'dashboard';
  ui.month = curMonth();
  render();
  toast('已清空，从零开始记账');
}

/* ================= 全局事件 ================= */
document.addEventListener('click', e => {
  const backdrop = e.target.closest('[data-backdrop]');
  if (backdrop && e.target === backdrop) { closeModal(); return; }

  if (e.target.closest('[data-close]')) { closeModal(); return; }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case 'nav':
      ui.page = el.dataset.page;
      ui.txLimit = 80;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'add-tx': openTxForm(); break;
    case 'edit-tx': openTxForm(id); break;
    case 'theme': toggleTheme(); break;
    case 'set-theme':
      db.settings.theme = el.dataset.val;
      save(); applyTheme(); render();
      break;
    case 'export': exportJSON(); break;
    case 'import-json': $('#json-file').click(); break;
    case 'seed': doSeed(); break;
    case 'clear': doClear(); break;
    case 'month':
      ui.month = addMonths(ui.month, Number(el.dataset.step) || 0);
      render();
      break;
    case 'reset-filters':
      ui.filters = { q: '', type: 'all', cat: 'all', acc: 'all', tag: 'all', from: '', to: '', min: '', max: '' };
      ui.txLimit = 80;
      render();
      break;
    case 'more-tx':
      ui.txLimit += 80;
      refreshTxList();
      break;
    case 'toggle-filters': {
      const card = $('.filters');
      if (card) {
        const open = card.classList.toggle('open');
        const btn = card.querySelector('[data-action="toggle-filters"]');
        if (btn) btn.textContent = open ? '收起筛选条件' : '筛选条件';
      }
      break;
    }
    case 'import-csv': $('#csv-file').click(); break;
    case 'add-acc': openAccForm(); break;
    case 'edit-acc': openAccForm(id); break;
    case 'add-rec': openRecForm(); break;
    case 'edit-rec': openRecForm(id); break;
    case 'toggle-rec': {
      const r = db.recurring.find(x => x.id === id);
      if (r) { r.enabled = !r.enabled; save(); render(); toast(r.enabled ? '已启用自动记账' : '已暂停'); }
      break;
    }
    case 'run-rec': {
      const r = db.recurring.find(x => x.id === id);
      if (!r) break;
      db.transactions.push({
        id: uid('tx'), type: r.type, amount: r.amount, date: todayStr(),
        categoryId: r.type === 'transfer' ? '' : r.categoryId,
        accountId: r.accountId, toAccountId: r.type === 'transfer' ? r.toAccountId : '',
        tags: (r.tags || []).slice(), note: r.name, ref: '', recurringId: r.id, createdAt: Date.now()
      });
      r.lastRun = curMonth();
      save(); render(); toast('已记入「' + r.name + '」' + fmtY(r.amount));
      break;
    }
    case 'add-cat': openCatForm(null, el.dataset.type); break;
    case 'edit-cat': openCatForm(id); break;
    case 'del-cat': deleteCategory(id); break;
    case 'add-tag': {
      const input = $('#new-tag');
      if (input && addTag(input.value)) input.value = '';
      break;
    }
    case 'del-tag': removeTag(el.dataset.tag); break;
    default: break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'tx-search') {
    ui.filters.q = e.target.value;
    ui.txLimit = 80;
    refreshTxList();
  }
});

document.addEventListener('change', e => {
  const f = e.target.dataset ? e.target.dataset.filter : null;
  if (f) {
    ui.filters[f] = e.target.value;
    ui.txLimit = 80;
    if (ui.page === 'transactions') refreshTxList();
  }
  if (e.target.id === 'csv-file') {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) handleBillFile(file);
  }
  if (e.target.id === 'json-file') {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) importJSONFile(file);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root') && $('#modal-root').innerHTML) {
    closeModal();
    return;
  }
  if (e.target && e.target.id === 'new-tag' && e.key === 'Enter') {
    e.preventDefault();
    addTag(e.target.value);
  }
});

/* ================= 初始化 ================= */
function init() {
  db = loadDb();
  if (!db) {
    db = seedDb();
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (err) { console.warn(err); }
  }
  applyTheme();
  runRecurring();
  render();
  flashSaved();
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme = () => { if (db.settings.theme === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
