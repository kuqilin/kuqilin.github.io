<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>望文生义 · 成语释义二选一</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .home-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 14px;
    color: #408d9f;
    background: rgba(255, 255, 255, .85);
    border: 1px solid #99c2cc;
    border-radius: 999px;
    padding: 8px 16px;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(25, 118, 140, .15);
    transition: background .15s, transform .15s;
  }
  .home-btn:hover { background: #eaf2f5; transform: translateY(-1px); }
  body {
    font-family: "LXGW WenKai", "Noto Serif SC", "Source Han Serif CN", "Songti SC", SimSun, serif;
    background: linear-gradient(160deg, #f2f7f9 0%, #eaf2f5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #99c2cc;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(25, 118, 140, .12);
    width: min(560px, 100%);
    padding: 40px 36px 36px;
    text-align: center;
  }
  .badge {
    font-size: 14px;
    letter-spacing: 2px;
    color: #408d9f;
    margin-bottom: 18px;
  }
  .idiom {
    font-size: 52px;
    font-weight: 700;
    color: #24292e;
    margin-bottom: 6px;
  }
  .question {
    font-size: 16px;
    color: #7d7d7d;
    margin-bottom: 28px;
  }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .opt {
    font-family: inherit;
    font-size: 17px;
    line-height: 1.7;
    text-align: left;
    padding: 14px 18px;
    border: 2px solid #99c2cc;
    border-radius: 10px;
    background: #fff;
    color: #24292e;
    cursor: pointer;
    transition: transform .08s, border-color .15s, background .15s;
  }
  .opt:hover { border-color: #408d9f; background: #eaf2f5; transform: translateY(-1px); }
  .opt:disabled { cursor: default; transform: none; }
  .opt.correct { border-color: #22863a; background: #f0fff4; color: #22863a; }
  .opt.wrong   { border-color: #d73a49; background: #ffeef0; color: #d73a49; }
  .opt.dim     { opacity: .55; }
  .feedback {
    margin-top: 20px;
    font-size: 16px;
    min-height: 26px;
    color: #7d7d7d;
  }
  .feedback.ok { color: #22863a; }
  .feedback.bad { color: #d73a49; }
  .next {
    margin-top: 18px;
    font-family: inherit;
    font-size: 17px;
    padding: 12px 34px;
    border: none;
    border-radius: 10px;
    background: #19768c;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(25, 118, 140, .35);
  }
  .next:hover { background: #00677f; }
  .count { margin-top: 22px; font-size: 12px; color: #73abb9; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .opt { animation: fadeUp .22s ease; }
  .idiom.flash { animation: fadeUp .3s ease; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
  .feedback.ok, .feedback.bad { animation: pop .3s ease; }
</style>
</head>
<body>
  <a class="home-btn" href="/" title="返回首页"><i class="fa-solid fa-home"></i>首页</a>
  <div class="card">
    <div class="badge">🧐 望文生义 · 成语释义二选一</div>
    <h1 class="idiom" id="idiom"></h1>
    <p class="question" id="question">下列选项中，哪一个是这个成语的正确释义？</p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next" hidden>下一题 ➡️</button>
    <div class="count" id="count"></div>
  </div>

<script>
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 连续两次不抽同一题
let last = null;
function pick(DATA) {
  let e;
  do {
    e = DATA[Math.floor(Math.random() * DATA.length)];
  } while (e === last && DATA.length > 1);
  last = e;
  return e;
}

const goodEmojis = ["👍", "🎉", "🌟", "💯", "🏆", "👏"];
const badEmojis = ["😅", "🤔", "💡", "🙈"];
function rand(a) { return a[Math.floor(Math.random() * a.length)]; }

async function start() {
  const idiomEl = document.getElementById("idiom");
  const questionEl = document.getElementById("question");
  const box = document.getElementById("options");
  const feedback = document.getElementById("feedback");
  const next = document.getElementById("next");
  const countEl = document.getElementById("count");

  let data;
  try {
    // cache: "no-store" 保证改了 JSON 后不用清浏览器缓存也能立刻看到新题
    const resp = await fetch("wang-wen-sheng-yi.json", { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    data = await resp.json();
  } catch (err) {
    idiomEl.textContent = "❌ 题库加载失败";
    questionEl.textContent = "请确认 wang-wen-sheng-yi.json 与本页面在同一个目录，并且通过 HTTP 访问（直接双击打开文件会被浏览器拦截）。";
    countEl.textContent = "错误：" + err.message;
    return;
  }

  const usable = data.filter(
    e => e["成语"] && e["原意"] && e["易错点"] && e["原意"] !== e["易错点"]
  );
  if (!usable.length) {
    idiomEl.textContent = "📭 题库为空";
    questionEl.textContent = "JSON 里没有可出的题（每条需含 成语/原意/易错点，且原意不等于易错点）。";
    return;
  }
  countEl.textContent = "📚 题库共 " + data.length + " 条，可出题 " + usable.length + " 条";

  function renderQuestion() {
    const entry = pick(usable);
    idiomEl.textContent = entry["成语"];
    idiomEl.classList.remove("flash");
    void idiomEl.offsetWidth;
    idiomEl.classList.add("flash");

    box.innerHTML = "";
    feedback.className = "feedback";
    feedback.textContent = "";
    next.hidden = true;

    const options = shuffle([
      { text: entry["原意"], correct: true },
      { text: entry["易错点"], correct: false },
    ]);

    let answered = false;
    for (const opt of options) {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = opt.text;
      btn.dataset.correct = opt.correct ? "true" : "false";
      btn.addEventListener("click", () => {
        if (answered) return;
        answered = true;
        for (const b of box.children) b.disabled = true;
        for (const b of box.children) {
          if (b.dataset.correct === "true") b.classList.add("correct");
        }
        if (opt.correct) {
          feedback.className = "feedback ok";
          feedback.textContent = rand(goodEmojis) + " 回答正确！";
        } else {
          btn.classList.add("wrong");
          for (const b of box.children) {
            if (b !== btn && b.dataset.correct !== "true") b.classList.add("dim");
          }
          feedback.className = "feedback bad";
          feedback.textContent = rand(badEmojis) + " 回答错误，选错了释义。";
        }
        next.hidden = false;
      });
      box.appendChild(btn);
    }
  }

  // 下一题不再整页刷新，前端直接换题
  next.addEventListener("click", renderQuestion);
  renderQuestion();
}

start();</script>
</body>
</html>
