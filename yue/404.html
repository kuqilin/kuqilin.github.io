<script>
(async function() {
  const canvas = document.getElementById('live2dcanvas');
  const app = new PIXI.Application({
    view: canvas,
    width: 960,
    height: 1280,
    backgroundAlpha: 0,

  const model = await PIXI.live2d.Live2DModel.from('/live2d/37_skin4/v2a2_306604_37.model3.json');
  model.scale.set(0.28);
  model.x = -100;
  model.y = 450;
  app.stage.addChild(model);

  // 所有动作（泉眼深处皮肤）
  const allMotions = [
    'b_diantou','b_feizou','b_fumo','b_gongji','b_idle',
    'b_jiangluo','b_jiangluo2','b_naxia','b_qiwu','b_ruchang',

    't_nanguo_bizui','t_shengqi','t_shengqi_bizui','t_shishen',
    't_shishen_bizui','t_yansu','t_yansu_bizui'
  ];

  let loopTimer = null;

  function playRandomMotion() {
    clearTimeout(loopTimer);
    const name = allMotions[Math.floor(Math.random() * allMotions.length)];
    console.log('Playing motion:', name);
    model.internalModel.motionManager.startMotion(name, 0);
    loopTimer = setTimeout(playRandomMotion, 5000);
  }

  // 等模型准备好
  setTimeout(playRandomMotion, 500);

  canvas.addEventListener('click', playRandomMotion);
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); playRandomMotion(); });

<script>
(function () {
  function markTall(img) {
    if (!img.naturalWidth || !img.naturalHeight) return;
    if (img.naturalHeight > img.naturalWidth) {
      img.classList.add("tall");
    } else {
      img.classList.remove("tall");
    }
  }
  function scan() {
    document.querySelectorAll(".article-entry img").forEach(function (img) {
      // 对B站图床的图片禁用Referer，绕过防盗链
      if (/hdslb\.com/.test(img.src)) {
        img.referrerPolicy = "no-referrer";
      }
      if (img.complete && img.naturalWidth) {
        markTall(img);
      } else {
        img.addEventListener("load", function () { markTall(img); }, { once: true });
      }
    });
  }
  // 主题使用 lazysizes 懒加载，加载完成时派发 lazyloaded 事件
  document.addEventListener("lazyloaded", function (e) {
    if (e.target && e.target.matches(".article-entry img")) markTall(e.target);
  });
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else {
    scan();
  }
})();
